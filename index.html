<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Favicon — place favicon.png in dumasafeguide/public/favicon.png ── -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DumaSafeGuide – Official emergency response portal for Dumaguete City. Real-time coordination and life-saving safety resources." />
    <title>DumaSafeGuide – City of Gentle People</title>
    <meta name="theme-color" content="#0d1b2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DumaSafeGuide" />

    <!-- ── Fonts: Syne (headings) + DM Sans (body) — loaded globally for all pages ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- ── Leaflet CSS ── -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- NOTE: No explicit Cloudflare Turnstile <script> tag here on purpose.
         @marsidev/react-turnstile manages script injection automatically
         (injectScript=true): it registers window.onloadTurnstileCallback
         BEFORE appending https://challenges.cloudflare.com/turnstile/v0/api.js
         to <head>. A hardcoded tag races that handshake (api.js fires the
         callback before the wrapper registers it, or the wrapper skips
         injection because the element id already exists while api.js
         initialized without its callback) and leaves window.turnstile
         undefined, so the widget never renders. Pages using manual
         window.turnstile.render() (Signup/Homepage) self-inject the script
         as a fallback when it is absent. Do NOT re-add a Turnstile script
         tag here. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
